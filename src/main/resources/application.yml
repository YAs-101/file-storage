server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: file-storage
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/file_storage?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}   # 本地开发默认值，部署时用环境变量覆盖
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
  servlet:
    multipart:
      # 必须 >= 分片大小 5MB，留 3MB 余量给表单字段与请求头
      max-file-size: 8MB
      max-request-size: 10MB
      file-size-threshold: 1MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 用 Slf4jImpl 而不是 StdOutImpl：后者直接写 stdout、完全无视日志级别，
    # 一次 1GB 压测会把每条 SQL 都喷出来。Slf4jImpl 走日志框架，
    # 需要看 SQL 时把 com.ys101.storage.mapper 调成 debug 即可
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

storage:
  # local | s3。切换只改这一行，业务代码不感知——这是存储抽象要证明的事
  type: ${STORAGE_TYPE:local}
  local:
    base-path: ./storage/data
    temp-path: ./storage/tmp
  # S3 兼容存储。默认指向本地 S3Mock（D:\Codex\s3mock-runner），接真实对象存储只改这一段
  s3:
    endpoint: ${S3_ENDPOINT:http://127.0.0.1:9090}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:test}
    secret-key: ${S3_SECRET_KEY:test}
    bucket: ${S3_BUCKET:file-storage}
    # MinIO / S3Mock / Ceph 只认 path-style；AWS 官方桶改 false
    path-style: ${S3_PATH_STYLE:true}
    chunk-prefix: chunks
    # 合并时并发发起 UploadPartCopy 的线程数。单次 copy 约 180ms，串行会拖成 9.5s/52 片
    merge-copy-threads: ${S3_COPY_THREADS:8}
  chunk-size: 5242880          # 5MB，与 S3 multipart 规范下限一致
  max-file-size: 5368709120    # 5GB，单文件上限，运维参数
  session-expire-hours: 24
  merge-lock-seconds: 30
  # 合并后校验策略，按后端能力分：
  #   auto   —— 后端能给产物指纹（S3 的 ETag）就用指纹，零传输；给不出（本地磁盘）就全量读回
  #   always —— 一律全量读回算 MD5，语义最强，1GB 多读一次整文件
  #   never  —— 一律不校验，只用于压测对照实验
  verify-merged-md5: ${STORAGE_VERIFY_MERGED_MD5:auto}
  # 并发 complete 时等待他人合并完成的上限，超时才报 1005
  merge-wait-ms: 3000

rate-limit:
  # 压测做对照实验时关掉，否则测出来的吞吐里混着限流开销
  enabled: ${RATE_LIMIT_ENABLED:true}
  # 单用户同时在飞的分片请求上限。取前端默认并发（8）的 1.5 倍：
  # 正常使用撞不到，只有客户端开几十并发或被人刷时才会触发
  chunk-concurrency: ${RATE_LIMIT_CHUNK_CONCURRENCY:12}
  # 一次 PUT 5MB 在本机不到 200ms，真实网络按 10Mbps 上行约 4s。
  # 30s 是「不会被误判过期」与「进程被 kill 后额度能自愈」的折中
  chunk-window-seconds: 30
  # init 的两层限制。真正的资源约束是 max-active-sessions：
  # init 每次写一行 upload_task，而这张表没有定时清理，刷起来是永久膨胀。
  # 按「未完成会话数」限比按「调用次数」限更贴近风险——正常用户传完就变终态、不占额度，
  # 批量上传 100 个文件也不会撞；恶意用户能堆出的活跃会话数被硬性封顶
  max-active-sessions: ${RATE_LIMIT_MAX_ACTIVE_SESSIONS:50}
  # 速率兜底。定 120 而不是 30：一次批量上传 100 个小文件就是 100 次 init
  init-per-minute: ${RATE_LIMIT_INIT_PER_MINUTE:120}

logging:
  level:
    root: info
    com.ys101.storage: info
    # 本机装了 1.2.24 的 tcnative-1.dll，Tomcat 要求 1.2.34，启动时必打一条 ERROR。
    # 它只影响可选的 APR 连接器，NIO 主链路完全正常。留着这条日志的代价是
    # 「启动就有 ERROR」变成常态，真故障反而被忽略，所以显式关掉这个类。
    org.apache.catalina.core.AprLifecycleListener: OFF
  pattern:
    # %X{rid} 是 RequestIdFilter 写进 MDC 的请求标识：一次上传会打散成十几个请求，
    # 并发时只能靠它把「同一次上传」的日志串起来。:- 表示缺省值，非 Web 线程（启动、定时任务）不会打出空方括号。
    console: "%d{HH:mm:ss.SSS} %-5level [%X{rid:-boot}] [%15.15thread] %-32.32logger{0} : %msg%n"
